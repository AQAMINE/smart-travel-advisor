spring:
  application:
    name: smart-travel-advisor

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_travel_db
    username: postgres
    password: ton_password_postgres

  jpa:
    hibernate:
      ddl-auto: validate # Flyway gère le schéma, Hibernate valide juste
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

